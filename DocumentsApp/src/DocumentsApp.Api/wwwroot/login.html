<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#3b82f6">
  <title>登录 · 文档管理</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='2' width='18' height='20' rx='3' fill='%233b82f6'/%3E%3Cpath d='M7 8h10M7 12h10M7 16h6' stroke='%23fff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-logo">
      <svg width="48" height="48" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="2" width="18" height="20" rx="3" fill="#3b82f6"/><path d="M7 8h10M7 12h10M7 16h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
    </div>
    <h1>文档管理系统</h1>
    <p class="login-sub">请登录后继续</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span>用户名</span>
        <input id="username" class="input" type="text" name="username" autocomplete="username"
               autocapitalize="off" spellcheck="false" placeholder="请输入用户名" required>
      </label>
      <label class="field">
        <span>密码</span>
        <input id="password" class="input" type="password" name="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </label>
      <p id="loginError" class="field-error" role="alert" hidden></p>
      <button id="loginBtn" type="submit" class="btn btn-primary btn-block btn-lg">登录</button>
    </form>
  </main>

  <script src="js/api.js"></script>
  <script>
    // 登录页逻辑
    (function () {
      const form = document.getElementById('loginForm');
      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const username = document.getElementById('username');
      const password = document.getElementById('password');

      // 已登录则直接进入主界面
      Api.me(true).then(() => { location.replace('/'); }).catch(() => { username.focus(); });

      function showError(msg) {
        errorEl.textContent = msg;
        errorEl.hidden = false;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.hidden = true;
        const u = username.value.trim();
        const p = password.value;
        if (!u) { showError('请输入用户名'); username.focus(); return; }
        if (!p) { showError('请输入密码'); password.focus(); return; }

        btn.disabled = true;
        btn.textContent = '登录中…';
        try {
          await Api.login(u, p);
          location.replace('/');
        } catch (err) {
          showError(err.message || '登录失败，请重试');
          password.select();
          btn.disabled = false;
          btn.textContent = '登录';
        }
      });
    })();
  </script>
</body>
</html>
